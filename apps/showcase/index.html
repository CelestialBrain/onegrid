<!DOCTYPE html>
<html lang="en" data-og-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oneGrid Showcase — every package wired together</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14181d;
        --border: #1f262e;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --accent-2: #a371f7;
        --good: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
      }
      pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
